<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
  <link rel="icon" href="data:,">
  <title>Water &amp; Glass</title>
  <style>
    :root {
      color: #f0ffff;
      background: #081b26;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { position: relative; height: 100vh; height: 100dvh; isolation: isolate; overflow: hidden; }
    canvas {
      display: block; width: 100%; height: 100%;
      touch-action: none; cursor: grab; outline: none;
    }
    canvas:active { cursor: grabbing; }
    canvas:focus-visible { outline: 1px solid #88f4dd; outline-offset: -5px; }
    .shade {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, #04131dd9 0%, #04131d55 19%, transparent 32%, transparent 70%, #04131d45 88%, #04131de8 100%);
    }
    header, footer {
      position: absolute; left: clamp(18px, 4vw, 62px); right: clamp(18px, 4vw, 62px);
      display: flex; justify-content: space-between; gap: 16px; pointer-events: none;
    }
    header { top: clamp(20px, 4.8vh, 52px); align-items: flex-start; }
    h1 {
      font: 400 clamp(33px, 5.65vw, 88px)/.98 Georgia, serif;
      letter-spacing: -.057em; margin: 0;
      text-shadow: 0 2px 24px #05121f70;
    }
    h1 span { color: #a2e4db; font-style: italic; }
    .controls { display: flex; gap: 8px; pointer-events: auto; }
    button {
      font: inherit; font-size: 12px; font-weight: 550; color: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 42px; padding: 7px 13px;
      background: #091f2dbd; border: 1px solid #c1f6ed36; border-radius: 5px; cursor: pointer;
    }
    button:hover { background: #174152; border-color: #a2e4db; }
    button:focus-visible { outline: 2px solid #a2e4db; outline-offset: 3px; }
    button:disabled { opacity: .45; cursor: default; }
    .pause-icon { width: 9px; height: 10px; border-inline: 2px solid currentColor; }
    [aria-pressed="true"] .pause-icon {
      width: 0; height: 0; margin-left: 2px;
      border: 5px solid transparent; border-left: 8px solid currentColor; border-right: 0;
    }
    .reset-icon { font-size: 18px; line-height: .7; }
    footer {
      bottom: clamp(17px, 3.5vh, 38px); align-items: center; flex-wrap: wrap;
      border-top: 1px solid #c1f6ed40; padding-top: 15px;
      color: #d7eceb; font-size: 12px;
    }
    .indices { display: flex; align-items: center; gap: 14px; }
    .indices span { display: flex; align-items: center; gap: 6px; }
    .indices b { font: 500 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: #a2e4db; }
    .indices i { width: 1px; height: 11px; background: #c1f6ed40; }
    .touch-help { display: none; }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      margin: 0; width: min(410px, 85%); padding: 20px; text-align: center;
      line-height: 1.5; background: #0a202d; border: 1px solid #c1f6ed40; border-radius: 5px;
    }
    @media (max-width: 575px) {
      header { gap: 8px; }
      h1 { font-size: clamp(32px, 8.3vw, 46px); }
      button { padding-inline: 10px; }
      .labels { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      button { min-width: 42px; }
      footer { gap: 8px 13px; padding-top: 11px; }
      .indices { gap: 8px; }
    }
    @media (pointer: coarse) {
      .mouse-help { display: none; }
      .touch-help { display: inline; }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="view" tabindex="0" aria-label="Interactive view of a glass cube half-submerged in water" aria-describedby="orbit-help"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <header>
      <h1>Water <span>&amp;</span> Glass</h1>
      <div class="controls">
        <button id="pause" type="button" aria-label="Pause waves" aria-pressed="false">
          <span class="pause-icon" aria-hidden="true"></span><span class="labels">Pause</span>
        </button>
        <button id="reset" type="button" aria-label="Reset camera">
          <span class="reset-icon" aria-hidden="true">↺</span><span class="labels">Reset</span>
        </button>
      </div>
    </header>
    <footer>
      <span id="orbit-help"><span class="mouse-help">Drag to orbit · Scroll to zoom</span><span class="touch-help">Swipe to orbit · Pinch to zoom</span></span>
      <div class="indices" aria-label="Refractive indices">
        <span>Water <b>1.333</b></span><i aria-hidden="true"></i><span>Glass <b>1.52</b></span>
      </div>
    </footer>
    <p id="error" role="status" hidden></p>
    <noscript><p>Enable JavaScript to view the WebGL2 scene.</p></noscript>
  </main>

  <script id="vertex" type="x-shader/x-vertex">#version 300 es
    void main() {
      vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
    }
  </script>

  <script id="fragment" type="x-shader/x-fragment">#version 300 es
    precision highp float;
    precision highp int;

    uniform vec2 uSize;
    uniform float uTime;
    uniform vec3 uEye;
    uniform vec3 uRight;
    uniform vec3 uUp;
    uniform vec3 uForward;
    uniform float uFocal;
    out vec4 outColor;

    const int SKY = 0, GLASS = 1, WATER = 2, FLOOR = 3, AIR = 4;
    const float FAR = 56.0;
    const float FLOOR_Y = -1.80;
    const float WATER_IOR = 1.333;
    const float GREEN_IOR = 1.522;
    const float BIAS = 0.0035;
    const vec3 GLASS_SIGMA = vec3(0.19, 0.062, 0.037);
    const vec3 WATER_SIGMA = vec3(0.65, 0.22, 0.14);
    const vec3 WATER_FOG = vec3(0.018, 0.127, 0.157);
    const vec3 GLASS_CENTER = vec3(0.0, -0.025, 0.0);
    const vec3 BOX_CORE = vec3(0.72, 0.72, 0.72);
    const float ROUNDING = 0.135;
    // Local axes of the tilted cube. GLSL matrices are column-major.
    const mat3 GLASS_TO_WORLD = mat3(
       0.848024, 0.195853, -0.492323,
      -0.225001, 0.974358,  0.0,
       0.479698, 0.110773,  0.870413
    );
    const mat3 WORLD_TO_GLASS = transpose(GLASS_TO_WORLD);

    struct Hit { float t; int kind; };

    float glassSdf(vec3 q) {
      vec3 d = abs(q) - BOX_CORE;
      return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0) - ROUNDING;
    }

    vec3 glassNormal(vec3 p) {
      vec3 q = WORLD_TO_GLASS * (p - GLASS_CENTER);
      vec3 n = sign(q) * max(abs(q) - BOX_CORE, 0.0);
      return normalize(GLASS_TO_WORLD * n);
    }

    float glassHit(vec3 ro, vec3 rd, float limit) {
      vec3 q = WORLD_TO_GLASS * (ro - GLASS_CENTER);
      vec3 v = WORLD_TO_GLASS * rd;
      vec3 inverse = sign(v + vec3(1e-16)) / max(abs(v), vec3(1e-6));
      vec3 a = (-BOX_CORE - ROUNDING - q) * inverse;
      vec3 b = ( BOX_CORE + ROUNDING - q) * inverse;
      vec3 lo = min(a, b), hi = max(a, b);
      float t = max(0.0, max(lo.x, max(lo.y, lo.z)));
      float end = min(limit, min(hi.x, min(hi.y, hi.z)) + 0.001);
      for (int i = 0; i < 32; ++i) {
        if (t >= end) break;
        float d = abs(glassSdf(q + v * t));
        if (d < 0.00032) return t;
        t += d * 0.999;
      }
      return FAR;
    }

    // Heights and exact horizontal gradients share phases across all interfaces.
    const vec2 K1 = vec2(2.23, 1.29);
    const vec2 K2 = vec2(-2.55, 3.72);
    const vec2 K3 = vec2(6.15, 2.75);
    const vec2 K4 = vec2(-5.05, 8.30);
    const vec4 WAVE_A = vec4(0.075, 0.036, 0.014, 0.006);

    vec4 wavePhases(vec2 p) {
      return vec4(dot(K1, p), dot(K2, p), dot(K3, p), dot(K4, p))
           + uTime * vec4(-1.28, 1.93, -2.66, 3.3);
    }
    float waterSdf(vec3 p) {
      // The zero set is the moving surface. Its slope bounds the ray step.
      return p.y - dot(WAVE_A, sin(wavePhases(p.xz)));
    }
    vec3 waterNormal(vec3 p) {
      vec4 slope = WAVE_A * cos(wavePhases(p.xz));
      vec2 gradient = K1 * slope.x + K2 * slope.y + K3 * slope.z + K4 * slope.w;
      return normalize(vec3(-gradient.x, 1.0, -gradient.y));
    }

    float waterHit(vec3 ro, vec3 rd, float limit) {
      const float band = 0.133;
      float t = 0.0, end = limit;
      if (abs(rd.y) < 0.00001) {
        if (abs(ro.y) > band) return FAR;
      } else {
        float a = (-band - ro.y) / rd.y;
        float b = ( band - ro.y) / rd.y;
        t = max(0.0, min(a, b));
        end = min(end, max(a, b));
      }
      float speed = abs(rd.y) + 0.512 * length(rd.xz);
      for (int i = 0; i < 44; ++i) {
        if (t >= end) break;
        float d = abs(waterSdf(ro + t * rd));
        if (d < 0.0004) return t;
        t += d / speed;
      }
      return FAR;
    }

    float floorHit(vec3 ro, vec3 rd) {
      if (rd.y >= -0.0001) return FAR;
      return min(FAR, max(0.0, (FLOOR_Y - ro.y) / rd.y));
    }

    Hit intersectScene(vec3 ro, vec3 rd, int medium) {
      float floorT = floorHit(ro, rd);
      float glassT = glassHit(ro, rd, floorT);
      if (medium == GLASS) return Hit(glassT, glassT < FAR ? GLASS : SKY);
      float waterT = waterHit(ro, rd, min(floorT, glassT));
      if (waterT < FAR) return Hit(waterT, WATER);
      if (glassT < FAR) return Hit(glassT, GLASS);
      return Hit(floorT, floorT < FAR ? FLOOR : SKY);
    }

    float windowLight(vec3 d, vec3 axis, float horizontal, float vertical) {
      vec3 x = normalize(cross(vec3(0.0, 1.0, 0.0), axis));
      vec3 y = cross(axis, x);
      vec2 uv = vec2(dot(d, x), dot(d, y));
      vec2 edge = abs(uv) / vec2(horizontal, vertical);
      return smoothstep(0.1, 0.65, dot(d, axis))
           * (1.0 - smoothstep(0.85, 1.03, max(edge.x, edge.y)));
    }

    vec3 environment(vec3 d) {
      float altitude = max(0.0, d.y);
      float horizon = exp(-abs(d.y) * 5.6);
      vec3 radiance = mix(vec3(0.026, 0.088, 0.139), vec3(0.25, 0.48, 0.55), horizon);
      radiance += vec3(0.11, 0.20, 0.30) * sqrt(altitude);
      vec3 key = normalize(vec3(-0.70, 0.57, -0.42));
      float facing = max(0.0, dot(d, key));
      radiance += vec3(0.43, 0.30, 0.21) * pow(facing, 11.0);
      radiance += vec3(4.5, 3.30, 2.44) * smoothstep(0.99954, 0.99988, facing);
      radiance += vec3(1.65, 1.76, 1.71) * windowLight(d, normalize(vec3(-0.31, 0.58, -0.75)), 0.42, 0.12);
      radiance += vec3(0.91, 1.48, 1.66) * windowLight(d, normalize(vec3(0.91, 0.34, 0.23)), 0.095, 0.44);
      radiance += vec3(3.65, 3.15, 2.52) * windowLight(d, normalize(vec3(-0.14, 0.29, -0.95)), 0.28, 0.047);
      return radiance;
    }

    float caustics(vec2 p) {
      vec2 phase = p * 2.9 + vec2(0.12, -0.17) * uTime;
      vec2 drift = vec2(sin(phase.y * 1.11 + uTime * 0.48),
                        sin(phase.x * 0.94 - uTime * 0.48));
      vec2 q = phase + 0.62 * drift;
      float a = sin(q.x + q.y * 0.29 + 0.44 * sin(q.y * 1.31));
      float b = sin(q.y - q.x * 0.43 + 0.39 * sin(q.x * 1.61));
      return exp(-12.0 * abs(a * b)) * (0.48 + 0.52 * abs(a - b) * 0.5);
    }

    vec3 basin(vec3 p, float distance) {
      vec2 tile = p.xz * 1.30;
      vec2 edge = 0.5 - abs(fract(tile) - 0.5);
      float width = 0.006 + distance * 0.0025;
      float seam = 1.0 - smoothstep(0.007, 0.007 + width, min(edge.x, edge.y));
      float variant = sin(dot(floor(tile), vec2(2.39, 3.14))) * 0.07;
      vec3 base = vec3(0.084, 0.235, 0.249) * (1.0 + variant - 0.47 * seam * exp(-0.022 * distance));
      float light = 0.52 + 0.48 * exp(-0.045 * dot(p.xz - vec2(-1.2, -1.0), p.xz - vec2(-1.2, -1.0)));
      vec2 footprint = p.xz - vec2(0.43, 0.24);
      float shadow = 1.0 - 0.51 * exp(-1.05 * dot(footprint, footprint));
      float focused = caustics(p.xz) * exp(-0.045 * distance);
      return shadow * light * (base + vec3(0.19, 0.37, 0.34) * focused);
    }

    vec3 waterTransmission(float distance) {
      return exp(-WATER_SIGMA * distance);
    }
    vec3 throughWater(vec3 light, float distance) {
      return mix(WATER_FOG, light, waterTransmission(distance));
    }
    float ior(int medium, float glassIor) {
      return medium == GLASS ? glassIor : (medium == WATER ? WATER_IOR : 1.0);
    }

    // Unpolarized dielectric Fresnel and Snell refraction use the same normal.
    float optics(vec3 rd, vec3 n, float fromIor, float toIor, out vec3 transmitted) {
      float ci = clamp(-dot(rd, n), 0.0, 1.0);
      float eta = fromIor / toIor;
      float ct2 = 1.0 - eta * eta * (1.0 - ci * ci);
      if (ct2 <= 0.0) {
        transmitted = vec3(0.0);
        return 1.0;
      }
      float ct = sqrt(ct2);
      transmitted = normalize(eta * rd + (eta * ci - ct) * n);
      float s = (fromIor * ci - toIor * ct) / (fromIor * ci + toIor * ct);
      float p = (toIor * ci - fromIor * ct) / (toIor * ci + fromIor * ct);
      return 0.5 * (s * s + p * p);
    }

    vec3 reflectionBackground(vec3 p, vec3 rd, int medium) {
      if (medium == WATER) {
        float t = floorHit(p, rd);
        if (t < FAR) return throughWater(basin(p + t * rd, t), t);
        return WATER_FOG;
      }
      return environment(rd);
    }

    vec3 walkInterfaces(vec3 ro, vec3 rd, int medium, Hit hit, float glassIor) {
      vec3 light = vec3(0.0), weight = vec3(1.0);
      for (int step = 0; step < 7; ++step) {
        vec3 p = ro + hit.t * rd;
        if (medium == WATER) {
          vec3 transmission = waterTransmission(hit.t);
          light += weight * (1.0 - transmission) * WATER_FOG;
          weight *= transmission;
        } else if (medium == GLASS) {
          weight *= exp(-GLASS_SIGMA * hit.t);
        }
        if (hit.kind == SKY) return light + weight * environment(rd);
        if (hit.kind == FLOOR) return light + weight * basin(p, hit.t);

        vec3 n;
        int next;
        if (hit.kind == GLASS) {
          n = glassNormal(p);
          if (medium == GLASS) {
            next = waterSdf(p) < 0.0 ? WATER : AIR;
            n = -n;
          } else {
            next = GLASS;
          }
        } else {
          next = medium == WATER ? AIR : WATER;
          n = waterNormal(p) * (medium == WATER ? -1.0 : 1.0);
        }

        vec3 transmitted;
        float f = optics(rd, n, ior(medium, glassIor), ior(next, glassIor), transmitted);
        vec3 reflected = reflect(rd, n);
        if (f >= 1.0) {
          ro = p + n * BIAS + reflected * BIAS;
          rd = reflected;
        } else {
          // Transmitted glass paths carry dispersion. Subcritical internal
          // reflections use a studio-light approximation to limit recursion.
          int outside = medium == GLASS ? next : medium;
          vec3 reflectedLight = reflectionBackground(p, reflected, outside);
          if (medium == GLASS) reflectedLight *= vec3(0.63, 0.86, 0.90);
          light += weight * f * reflectedLight;
          weight *= 1.0 - f;
          ro = p - n * BIAS + transmitted * BIAS;
          rd = transmitted;
          medium = next;
        }
        hit = intersectScene(ro, rd, medium);
      }
      return light + weight * reflectionBackground(ro, rd, medium);
    }

    vec3 disperse(vec3 ro, vec3 rd, int medium, Hit hit) {
      return vec3(walkInterfaces(ro, rd, medium, hit, 1.503).r,
                  walkInterfaces(ro, rd, medium, hit, GREEN_IOR).g,
                  walkInterfaces(ro, rd, medium, hit, 1.548).b);
    }

    vec3 renderScene(vec3 ro, vec3 rd) {
      Hit first = intersectScene(ro, rd, AIR);
      if (first.kind == GLASS) return disperse(ro, rd, AIR, first);
      if (first.kind != WATER) return environment(rd);

      vec3 p = ro + first.t * rd;
      vec3 n = waterNormal(p);
      vec3 transmitted;
      float f = optics(rd, n, 1.0, WATER_IOR, transmitted);
      vec3 reflected = reflect(rd, n);
      // At grazing incidence, distant ripples merge into the horizon.
      float haze = smoothstep(10.0, 33.0, first.t);
      vec3 bounce = p + n * BIAS + reflected * BIAS;
      float reflectedGlass = glassHit(bounce, reflected, FAR);
      bool seesGlass = reflectedGlass < FAR && waterHit(bounce, reflected, reflectedGlass) == FAR;
      vec3 reflectedLight = seesGlass
        ? walkInterfaces(bounce, reflected, AIR, Hit(reflectedGlass, GLASS), GREEN_IOR)
        : environment(reflected);

      vec3 below = p - n * BIAS + transmitted * BIAS;
      Hit next = intersectScene(below, transmitted, WATER);
      vec3 refractedLight = next.kind == GLASS
        ? disperse(below, transmitted, WATER, next)
        : walkInterfaces(below, transmitted, WATER, next, GREEN_IOR);
      return mix(mix(refractedLight, reflectedLight, f), environment(rd), haze);
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * uSize) / uSize.y;
      vec3 rd = normalize(uForward * uFocal + uv.x * uRight + uv.y * uUp);
      vec3 c = renderScene(uEye, rd);
      c *= 1.0 - 0.14 * smoothstep(0.22, 0.92, length(uv));
      c = c * (1.30 + c * 0.30) / (1.0 + c * (1.25 + c * 0.30));
      c = pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));
      float dither = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
      outColor = vec4(clamp(c + (dither - 0.5) / 255.0, 0.0, 1.0), 1.0);
    }
  </script>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("view");
      const pause = document.getElementById("pause");
      const reset = document.getElementById("reset");
      const error = document.getElementById("error");
      const gl = canvas.getContext("webgl2", {
        alpha: false, antialias: false, depth: false, stencil: false
      });
      const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
      const initialCamera = { yaw: -0.12, pitch: 0.34, radius: 4.55 };
      const camera = { ...initialCamera };
      const pointers = new Map();
      let paused = motionPreference.matches;
      let program, uniforms, vao;
      let frame = 0;
      let previousTime;
      let waveTime = 0.72;
      let restored = false;
      let renderScale = 1;
      let frameAverage = 17;
      let qualitySamples = 0;

      function showError(message) {
        error.hidden = !message;
        error.textContent = message;
        pause.disabled = reset.disabled = Boolean(message);
      }

      if (!gl) {
        showError("This scene needs WebGL2. Enable hardware acceleration or open it in a browser with WebGL2 support.");
        return;
      }

      function compile(type, id) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, document.getElementById(id).textContent);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const message = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(message);
        }
        return shader;
      }

      function initialize() {
        let vertex, fragment;
        try {
          vertex = compile(gl.VERTEX_SHADER, "vertex");
          fragment = compile(gl.FRAGMENT_SHADER, "fragment");
          program = gl.createProgram();
          gl.attachShader(program, vertex);
          gl.attachShader(program, fragment);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
          }
          uniforms = Object.fromEntries(
            ["uSize", "uTime", "uEye", "uRight", "uUp", "uForward", "uFocal"]
              .map(name => [name, gl.getUniformLocation(program, name)])
          );
          vao = gl.createVertexArray();
          restored = true;
          previousTime = undefined;
          showError("");
          schedule();
        } catch (e) {
          if (program) gl.deleteProgram(program);
          console.error(e);
          showError("The WebGL2 renderer could not start on this device.");
        } finally {
          if (vertex) gl.deleteShader(vertex);
          if (fragment) gl.deleteShader(fragment);
        }
      }

      const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

      function schedule() {
        if (!frame && restored && !document.hidden) frame = requestAnimationFrame(draw);
      }

      function draw(now) {
        frame = 0;
        if (!restored || document.hidden) return;
        if (!paused && previousTime !== undefined) {
          const elapsed = now - previousTime;
          waveTime += Math.min(elapsed, 80) / 1000;
          frameAverage += 0.10 * (Math.min(elapsed, 150) - frameAverage);
          if (++qualitySamples >= 32) {
            if (frameAverage > 27) renderScale = Math.max(0.49, renderScale * 0.84);
            if (frameAverage < 17.8) renderScale = Math.min(1, renderScale * 1.05);
            qualitySamples = 0;
          }
        }
        previousTime = now;

        const cssWidth = canvas.clientWidth, cssHeight = canvas.clientHeight;
        if (!cssWidth || !cssHeight) return;
        const dpr = Math.min(devicePixelRatio || 1, 1.5, Math.sqrt(980000 / (cssWidth * cssHeight)));
        const width = Math.max(1, Math.round(cssWidth * dpr * renderScale));
        const height = Math.max(1, Math.round(cssHeight * dpr * renderScale));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }

        const { yaw, pitch, radius } = camera;
        const sx = Math.sin(yaw), cx = Math.cos(yaw);
        const sy = Math.sin(pitch), cy = Math.cos(pitch);
        gl.viewport(0, 0, width, height);
        gl.useProgram(program);
        gl.bindVertexArray(vao);
        gl.uniform2f(uniforms.uSize, width, height);
        gl.uniform1f(uniforms.uTime, waveTime);
        gl.uniform3f(uniforms.uEye, radius * cy * sx, radius * sy - 0.045, radius * cy * cx);
        gl.uniform3f(uniforms.uForward, -cy * sx, -sy, -cy * cx);
        gl.uniform3f(uniforms.uRight, cx, 0, -sx);
        gl.uniform3f(uniforms.uUp, -sx * sy, cy, -cx * sy);
        gl.uniform1f(uniforms.uFocal, 1.43 * Math.min(1, cssWidth / cssHeight * 1.10));
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        if (!paused) schedule();
      }

      function setPaused(value) {
        paused = value;
        previousTime = undefined;
        pause.setAttribute("aria-pressed", String(paused));
        pause.setAttribute("aria-label", paused ? "Resume waves" : "Pause waves");
        pause.querySelector(".labels").textContent = paused ? "Play" : "Pause";
        schedule();
      }

      function orbit(dx, dy) {
        camera.yaw = (camera.yaw - dx * 0.006) % (Math.PI * 2);
        camera.pitch = clamp(camera.pitch + dy * 0.005, 0.09, 1.29);
        schedule();
      }

      function zoom(factor) {
        camera.radius = clamp(camera.radius * factor, 2.9, 8.5);
        schedule();
      }

      function pinchDistance() {
        const [a, b] = pointers.values();
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      canvas.addEventListener("pointerdown", event => {
        if (event.button !== 0 || pointers.size >= 2) return;
        canvas.focus({ preventScroll: true });
        canvas.setPointerCapture(event.pointerId);
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      });
      canvas.addEventListener("pointermove", event => {
        const old = pointers.get(event.pointerId);
        if (!old) return;
        const before = pointers.size === 2 ? pinchDistance() : 0;
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size === 1) orbit(event.clientX - old.x, event.clientY - old.y);
        else if (before > 0) zoom(before / Math.max(1, pinchDistance()));
      });
      for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) {
        canvas.addEventListener(name, event => pointers.delete(event.pointerId));
      }

      canvas.addEventListener("wheel", event => {
        event.preventDefault();
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvas.clientHeight : 1;
        zoom(Math.exp(clamp(event.deltaY * unit * 0.001, -1, 1)));
      }, { passive: false });

      canvas.addEventListener("keydown", event => {
        switch (event.key) {
          case "ArrowLeft": orbit(-22, 0); break;
          case "ArrowRight": orbit(22, 0); break;
          case "ArrowUp": orbit(0, 19); break;
          case "ArrowDown": orbit(0, -19); break;
          case "+": case "=": zoom(0.9); break;
          case "-": zoom(1.11); break;
          case " ": setPaused(!paused); break;
          case "Home": reset.click(); break;
          default: return;
        }
        event.preventDefault();
      });
      pause.addEventListener("click", () => setPaused(!paused));
      reset.addEventListener("click", () => {
        Object.assign(camera, initialCamera);
        schedule();
      });
      motionPreference.addEventListener("change", event => setPaused(event.matches));
      document.addEventListener("visibilitychange", () => {
        previousTime = undefined;
        schedule();
      });
      new ResizeObserver(schedule).observe(canvas);
      canvas.addEventListener("webglcontextlost", event => {
        event.preventDefault();
        restored = false;
        cancelAnimationFrame(frame);
        frame = 0;
        showError("WebGL2 paused while the graphics context recovers.");
      });
      canvas.addEventListener("webglcontextrestored", initialize);
      setPaused(paused);
      initialize();
    })();
  </script>
</body>
</html>
