// 8. ORBIT CAMERA & INTERACTION (Slow Auto-Orbit + Smooth Drag / Zoom / Focus)
// ============================================================================
const cam = {
  yaw: 0.0,
  pitch: 0.24,
  dist: 7.4,
  target: [0.0, 0.86, -0.05],
  goalYaw: 0.0,
  goalPitch: 0.24,
  goalDist: 7.4,
  goalTarget: [0.0, 0.86, -0.05],
  autoOrbit: true,
  dragging: false,
  lastX: 0,
  lastY: 0,
  idleTimer: 0
};

const btnOrbit = document.getElementById("btnOrbit");
const btnReset = document.getElementById("btnReset");

btnOrbit.addEventListener("click", () => {
  cam.autoOrbit = !cam.autoOrbit;
  btnOrbit.classList.toggle("active", cam.autoOrbit);
});
btnReset.addEventListener("click", () => {
  cam.goalYaw = 0.0;
  cam.goalPitch = 0.24;
  cam.goalDist = 7.4;
  cam.goalTarget = [0.0, 0.86, -0.05];
});

document.querySelectorAll(".chip").forEach(el => {
  el.addEventListener("click", () => {
    const fx = parseFloat(el.dataset.focus);
    cam.goalTarget = [fx, 1.02, 0.05];
    cam.goalDist = 3.65;
    cam.goalPitch = 0.18;
    cam.idleTimer = 6.0;
  });
});

canvas.addEventListener("pointerdown", e => {
  cam.dragging = true;
  cam.lastX = e.clientX;
  cam.lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!cam.dragging) return;
  const dx = e.clientX - cam.lastX;
  const dy = e.clientY - cam.lastY;
  cam.lastX = e.clientX;
  cam.lastY = e.clientY;
  cam.goalYaw -= dx * 0.0062;
  cam.goalPitch = Math.max(-0.04, Math.min(1.18, cam.goalPitch + dy * 0.0052));
  cam.idleTimer = 3.5;
});
function endDrag(e) {
  if (cam.dragging) {
    cam.dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  cam.goalDist = Math.max(2.4, Math.min(13.5, cam.goalDist * Math.exp(e.deltaY * 0.00085)));
  cam.idleTimer = 2.5;
}, { passive: false });

// ============================================================================
// 9. RENDER PIPELINE
// ============================================================================
// Overhead key light view-projection matrix for soft shadows
const lightEye = [-1.4, 6.8, 2.7];
const lightVP = M4.mul(
  M4.ortho(-4.8, 4.8, -3.2, 3.2, 1.2, 14.5),
  M4.lookAt(lightEye, [0.0, 0.4, -0.15], [0, 1, 0])
);

function renderShadowMap() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT); // Reduces shadow acne

  gl.useProgram(progShadow.prog);
  gl.uniformMatrix4fv(progShadow.u.uLightVP, false, lightVP);

  for (const item of opaqueItems) {
    if (!item.castShadow) continue;
    gl.uniformMatrix4fv(progShadow.u.uModel, false, item.model);
    gl.bindVertexArray(item.mesh.vao);
    gl.drawElements(gl.TRIANGLES, item.mesh.count, item.mesh.type, 0);
  }
  gl.cullFace(gl.BACK);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// Static shadow map needs only 1 initial render since all shadow casters are rigid!
renderShadowMap();

let lastTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastTime) * 0.001, 0.05);
  lastTime = now;
  const t = now * 0.001;

  resizeBuffers();

  // Camera smooth orbit & damping
  if (!cam.dragging) {
    if (cam.idleTimer > 0) {
      cam.idleTimer = Math.max(0, cam.idleTimer - dt);
    } else if (cam.autoOrbit) {
      cam.goalYaw += dt * 0.145; // Graceful slow continuous orbit
    }
  }
  const damp = 1 - Math.exp(-dt * 7.5);
  cam.yaw   += (cam.goalYaw - cam.yaw) * damp;
  cam.pitch += (cam.goalPitch - cam.pitch) * damp;
  cam.dist  += (cam.goalDist - cam.dist) * damp;
  cam.target[0] += (cam.goalTarget[0] - cam.target[0]) * damp;
  cam.target[1] += (cam.goalTarget[1] - cam.target[1]) * damp;
  cam.target[2] += (cam.goalTarget[2] - cam.target[2]) * damp;

  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const sy = Math.sin(cam.yaw),   cy = Math.cos(cam.yaw);
  const camPos = [
    cam.target[0] + cam.dist * cp * sy,
    cam.target[1] + cam.dist * sp,
    cam.target[2] + cam.dist * cp * cy
  ];

  const proj = M4.perspective(38 * Math.PI / 180, viewW / viewH, 0.1, 60.0);
  const view = M4.lookAt(camPos, cam.target, [0, 1, 0]);
  const viewProj = M4.mul(proj, view);

  // Camera right & up vectors for billboarded atmospheric halos & embers
  const camRight = [view[0], view[4], view[8]];
  const camUp    = [view[1], view[5], view[9]];

  // Dynamic realistic flickering element light values
  const cFlick = 1.0 + 0.11 * Math.sin(t * 7.3) + 0.06 * Math.sin(t * 16.9) + 0.04 * Math.cos(t * 27.1);
  const cSwayX = Math.sin(t * 3.1) * 0.045;
  const cSwayZ = Math.cos(t * 2.6) * 0.045;
  const carbonPos = [-2.25 + cSwayX, 1.56 + Math.sin(t * 5.2) * 0.04, 0.05 + cSwayZ];
  const carbonCol = [3.6 * cFlick, 1.72 * cFlick, 0.36 * cFlick];

  const hFlick = 1.0 + 0.055 * Math.sin(t * 13.7) + 0.035 * Math.cos(t * 29.4);
  const hydrogenPos = [-0.75 + Math.sin(t * 6.4)*0.015, 1.44, 0.05 + Math.cos(t * 5.8)*0.015];
  const hydrogenCol = [0.78 * hFlick, 1.65 * hFlick, 3.65 * hFlick];

  const arHum = 0.97 + 0.03 * Math.sin(t * 37.0);
  const argonA = [0.75, 0.58, 0.05];
  const argonB = [0.75, 1.72, 0.05];
  const argonCol = [1.85 * arHum, 1.08 * arHum, 4.45 * arHum];

  const neHum = 0.97 + 0.03 * Math.sin(t * 37.0 + 1.8);
  const neonA = [2.25, 0.58, 0.05];
  const neonB = [2.25, 1.72, 0.05];
  const neonCol = [4.95 * neHum, 0.88 * neHum, 0.14 * neHum];

  // ==========================================================================
  // PASS 1: Main Opaque PBR Scene into HDR FBO
  // ==========================================================================
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fbo);
  gl.viewport(0, 0, viewW, viewH);
  gl.clearColor(0.012, 0.015, 0.022, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  gl.useProgram(progPBR.prog);
  const up = progPBR.u;
  gl.uniformMatrix4fv(up.uViewProj, false, viewProj);
  gl.uniformMatrix4fv(up.uLightVP, false, lightVP);
  gl.uniform3fv(up.uCamPos, camPos);
  gl.uniform1f(up.uTime, t);

  gl.uniform3fv(up.uCarbonPos, carbonPos);
  gl.uniform3fv(up.uCarbonCol, carbonCol);
  gl.uniform3fv(up.uHydrogenPos, hydrogenPos);
  gl.uniform3fv(up.uHydrogenCol, hydrogenCol);
  gl.uniform3fv(up.uArgonA, argonA);
  gl.uniform3fv(up.uArgonB, argonB);
  gl.uniform3fv(up.uArgonCol, argonCol);
  gl.uniform3fv(up.uNeonA, neonA);
  gl.uniform3fv(up.uNeonB, neonB);
  gl.uniform3fv(up.uNeonCol, neonCol);

  // Bind textures
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, shadowTex);      gl.uniform1i(up.uShadowMap, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, woodTex.albedo); gl.uniform1i(up.uWoodAlbedo, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, woodTex.map);    gl.uniform1i(up.uWoodMap, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, plaqueTex);      gl.uniform1i(up.uPlaqueTex, 3);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, hvFaceTex);      gl.uniform1i(up.uHVFaceTex, 4);

  for (const item of opaqueItems) {
    gl.uniformMatrix4fv(up.uModel, false, item.model);
    gl.uniform3fv(up.uAlbedo, item.mat.albedo);
    gl.uniform1f(up.uMetallic, item.mat.metal);
    gl.uniform1f(up.uRoughness, item.mat.rough);
    gl.uniform3fv(up.uEmissive, item.mat.emissive);
    gl.uniform1i(up.uMatType, item.mat.type);
    gl.bindVertexArray(item.mesh.vao);
    gl.drawElements(gl.TRIANGLES, item.mesh.count, item.mesh.type, 0);
  }

  // ==========================================================================
  // PASS 2: Volumetric Gas Discharge Plasma (Argon & Neon, Additive HDR)
  // ==========================================================================
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.depthMask(false);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  gl.useProgram(progPlasma.prog);
  gl.uniformMatrix4fv(progPlasma.u.uViewProj, false, viewProj);
  gl.uniform3fv(progPlasma.u.uCamPos, camPos);
  gl.uniform1f(progPlasma.u.uTime, t);

  for (const pl of plasmaItems) {
    gl.uniformMatrix4fv(progPlasma.u.uModel, false, pl.model);
    gl.uniform1i(progPlasma.u.uGasType, pl.gasType);
    gl.bindVertexArray(pl.mesh.vao);
    gl.drawElements(gl.TRIANGLES, pl.mesh.count, pl.mesh.type, 0);
  }

  // ==========================================================================
  // PASS 3: Borosilicate Glass Shells & Clear Liquids (Back then Front faces)
  // ==========================================================================
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progGlass.prog);
  const ug = progGlass.u;
  gl.uniformMatrix4fv(ug.uViewProj, false, viewProj);
  gl.uniform3fv(ug.uCamPos, camPos);
  gl.uniform3fv(ug.uCarbonPos, carbonPos);
  gl.uniform3fv(ug.uCarbonCol, carbonCol);
  gl.uniform3fv(ug.uHydrogenPos, hydrogenPos);
  gl.uniform3fv(ug.uHydrogenCol, hydrogenCol);
  gl.uniform3fv(ug.uArgonA, argonA);
  gl.uniform3fv(ug.uArgonB, argonB);
  gl.uniform3fv(ug.uArgonCol, argonCol);
  gl.uniform3fv(ug.uNeonA, neonA);
  gl.uniform3fv(ug.uNeonB, neonB);
  gl.uniform3fv(ug.uNeonCol, neonCol);

  for (const passCull of [gl.FRONT, gl.BACK]) {
    gl.cullFace(passCull);
    for (const g of glassItems) {
      gl.uniformMatrix4fv(ug.uModel, false, g.model);
      gl.uniform3fv(ug.uGlassTint, g.tint);
      gl.uniform3fv(ug.uInnerGlowTint, g.innerTint);
      gl.uniform1f(ug.uInnerGlowAmt, g.innerAmt);
      gl.uniform1f(ug.uOpacityBoost, g.opacityBoost);
      gl.bindVertexArray(g.mesh.vao);
      gl.drawElements(gl.TRIANGLES, g.mesh.count, g.mesh.type, 0);
    }
  }

  // ==========================================================================
  // PASS 4: True 3D Raymarched Volumetric Flames (Carbon & Hydrogen)
  // ==========================================================================
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.cullFace(gl.FRONT); // Render back faces of bounding volume so camera never clips inside!
  gl.useProgram(progFlame.prog);
  const uf = progFlame.u;
  gl.uniformMatrix4fv(uf.uViewProj, false, viewProj);
  gl.uniform3fv(uf.uCamPos, camPos);
  gl.uniform1f(uf.uTime, t);
  gl.bindVertexArray(unitCylMesh.vao);

  // Carbon Flame
  gl.uniformMatrix4fv(uf.uModel, false, carbonFlameModel);
  gl.uniformMatrix4fv(uf.uInvModel, false, carbonFlameInv);
  gl.uniform1i(uf.uFlameType, 0);
  gl.drawElements(gl.TRIANGLES, unitCylMesh.count, unitCylMesh.type, 0);

  // Hydrogen Flame
  gl.uniformMatrix4fv(uf.uModel, false, hydrogenFlameModel);
  gl.uniformMatrix4fv(uf.uInvModel, false, hydrogenFlameInv);
  gl.uniform1i(uf.uFlameType, 1);
  gl.drawElements(gl.TRIANGLES, unitCylMesh.count, unitCylMesh.type, 0);

  // ==========================================================================
  // PASS 5: Soft Atmospheric Glow Halos & Rising Carbon Sparks
  // ==========================================================================
  gl.disable(gl.CULL_FACE);
  gl.useProgram(progHalo.prog);
  const uh = progHalo.u;
  gl.uniformMatrix4fv(uh.uViewProj, false, viewProj);
  gl.uniform3fv(uh.uCamRight, camRight);
  gl.uniform3fv(uh.uCamUp, camUp);
  gl.bindVertexArray(haloVAO);

  function drawHalo(center, sx, sy, col, power) {
    gl.uniform3fv(uh.uCenter, center);
    gl.uniform2f(uh.uSize, sx, sy);
    gl.uniform3fv(uh.uColor, col);
    gl.uniform1f(uh.uPower, power);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  // Soft air-scattering glow around each luminous element
  drawHalo(carbonPos, 0.78, 1.05, [0.24 * cFlick, 0.11 * cFlick, 0.015], 3.2);
  drawHalo(hydrogenPos, 0.62, 0.88, [0.055 * hFlick, 0.125 * hFlick, 0.28 * hFlick], 3.4);
  drawHalo([0.75, 1.14, 0.05], 0.76, 1.25, [0.16 * arHum, 0.095 * arHum, 0.42 * arHum], 3.0);
  drawHalo([2.25, 1.14, 0.05], 0.80, 1.28, [0.46 * neHum, 0.075 * neHum, 0.010], 3.0);

  // Rising incandescent carbon micro-sparks above Carbon flame
  for (const sp of sparks) {
    const life = (t * sp.speed + sp.phase) % 1.0;
    const y = 1.45 + life * 1.38;
    const spiral = sp.ang + life * 3.8 + Math.sin(t * 2.5 + sp.ang) * 0.6;
    const rad = sp.rad * (0.4 + life * 2.1);
    const px = -2.25 + Math.cos(spiral) * rad + Math.sin(t * 2.8 - life * 3.0) * 0.05;
    const pz =  0.05 + Math.sin(spiral) * rad + Math.cos(t * 2.3 - life * 3.0) * 0.05;
    const fade = Math.sin(life * Math.PI) * (1.0 - life * 0.45);
    const sz = sp.size * (1.0 - life * 0.45);
    drawHalo([px, y, pz], sz, sz, [2.6 * fade, 1.1 * fade, 0.18 * fade], 2.2);
  }

  // ==========================================================================
  // PASS 6: Multi-Scale HDR Bloom (Extract + 3-Mip Separable Gaussian Blur)
  // ==========================================================================
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(fsqVAO);

  // Bright extraction into bloomA[0]
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA[0].fbo);
  gl.viewport(0, 0, bloomA[0].w, bloomA[0].h);
  gl.useProgram(progBright.prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.uniform1i(progBright.u.uTex, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // Separable Gaussian Blur across 3 progressive mip levels
  gl.useProgram(progBlur.prog);
  gl.uniform1i(progBlur.u.uTex, 0);
  for (let i = 0; i < 3; i++) {
    const srcTex = i === 0 ? bloomA[0].tex : bloomA[i - 1].tex;
    const w = bloomA[i].w, h = bloomA[i].h;
    // Horizontal pass -> bloomB[i]
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB[i].fbo);
    gl.viewport(0, 0, w, h);
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform2f(progBlur.u.uDir, 1.0 / w, 0.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // Vertical pass -> bloomA[i]
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA[i].fbo);
    gl.bindTexture(gl.TEXTURE_2D, bloomB[i].tex);
    gl.uniform2f(progBlur.u.uDir, 0.0, 1.0 / h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ==========================================================================
  // PASS 7: ACES Filmic Tone Mapping & Final Screen Output
  // ==========================================================================
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, viewW, viewH);
  gl.useProgram(progComposite.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);  gl.uniform1i(progComposite.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomA[0].tex); gl.uniform1i(progComposite.u.uBloom1, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bloomA[1].tex); gl.uniform1i(progComposite.u.uBloom2, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, bloomA[2].tex); gl.uniform1i(progComposite.u.uBloom3, 3);
  gl.uniform1f(progComposite.u.uExposure, 1.12);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.depthMask(true);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
})();
</script>
</body>
</html>
